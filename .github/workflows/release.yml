name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
        with:
          role-to-assume: arn:aws:iam::142548018081:role/ci-tigerfs
          aws-region: us-east-1

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AWS_REGION: us-east-1

      - name: Upload root files to S3
        if: "!contains(github.ref_name, '-')"
        env:
          AWS_DEFAULT_REGION: us-east-1
        run: |
          echo "${GITHUB_REF_NAME}" > latest.txt
          aws s3 cp latest.txt s3://tigerfs-releases/latest.txt
          aws s3 cp scripts/install.sh s3://tigerfs-releases/install.sh

      - name: Invalidate CloudFront Cache
        if: "!contains(github.ref_name, '-')"
        env:
          AWS_REGION: us-east-1
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/latest.txt" "/install.sh"
